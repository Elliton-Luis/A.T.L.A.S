server {
    listen 80;
    server_name seu-dominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name seu-dominio.com;

    root /var/www/atlas/public;
    index index.php;

    # Certificados SSL (Cloudflare Origin Certificate recomendado)
    # ssl_certificate /etc/ssl/certs/cert.pem;
    # ssl_certificate_key /etc/ssl/private/key.pem;

    # Rota do Webhook do Telegram com Filtro de IP Estrito
    location /webhook.php {
        # Faixas de IP oficiais do Telegram
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;

        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloqueia acesso a qualquer arquivo oculto ou banco de dados
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~* \.sqlite$ {
        deny all;
    }
}
